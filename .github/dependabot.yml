---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    ignore:
      # https://github.com/charmbracelet/bubbles/issues/1045
      - dependency-name: "charm.land/bubbles/v2"
        versions: [">= 2.2.0"]

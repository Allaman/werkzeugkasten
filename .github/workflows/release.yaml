---
name: Release

# Only release when a new GH tag is added
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Rebuild an existing tag, e.g. when its release run failed
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout and set env
      - name: Checkout
        uses: actions/checkout@v7
        # It is required for the changelog to work correctly.
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
      # Build & Release binaries
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
      # GitHub marks every new release as latest, which is wrong for a rebuilt older tag
      - name: Restore latest release
        if: github.event_name == 'workflow_dispatch'
        run: gh release edit "$(git tag --sort=-v:refname | head -1)" --latest
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}

  changelog:
    name: Generate changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: Update CHANGELOG"
          file_pattern: CHANGELOG.md
          branch: main
